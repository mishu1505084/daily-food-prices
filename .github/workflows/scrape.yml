name: Daily Shwapno prices

on:
  schedule:
    # 03:00 UTC = 9:00 AM Bangladesh time (UTC+6). GitHub can start scheduled runs a few minutes late.
    - cron: "0 3 * * *"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape Shwapno
        run: python scraper/scrape.py

      - name: Commit today's data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Prices for $(TZ=Asia/Dhaka date +%F)"
            git push
          fi
